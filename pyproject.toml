[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shopsense"
version = "0.1.0"
description = "Hybrid multi-agent shopping support assistant"
requires-python = ">=3.11"
dependencies = [
  "uvicorn[standard]==0.54.0",
  "langgraph==1.2.12",
  "langgraph-checkpoint-sqlite==3.1.1",
  "langchain-mcp-adapters==0.3.2",
  "aiosqlite==0.21.0",
  "httpx==0.28.1",
  "qdrant-client==1.19.1",
  "pdfplumber==0.11.10",
  "pydantic-settings==2.15.0",
  "mcp==1.30.0",
  "PyJWT==2.15.1",
  "langfuse==5.2.0",
  "supermemory==5.0.1",
  "streamlit==1.67.0",
  "python-dotenv==1.1.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==0.26.0",
  "reportlab==4.5.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.agents.care_agent" = ["agent.json", "prompts/*.txt"]
"app.agents.intent_agent" = ["agent.json", "prompts/*.txt"]
"app.agents.order_agent" = ["agent.json", "prompts/*.txt"]
"app.agents.refund_agent" = ["agent.json", "prompts/*.txt"]
