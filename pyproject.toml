[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shopsense"
version = "0.1.0"
description = "Local-first multi-agent shopping support assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "langgraph>=0.2,<2.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "httpx>=0.27,<1.0",
  "qdrant-client[fastembed]>=1.11,<2.0",
  "pdfplumber>=0.11,<1.0",
  "pydantic-settings>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "reportlab>=4.2,<5.0",
]
ui = [
  "chainlit>=2.0,<3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.agents.care_agent" = ["agent.json", "prompts/*.txt"]
"app.agents.intent_agent" = ["agent.json", "prompts/*.txt"]
"app.agents.order_agent" = ["agent.json", "prompts/*.txt"]
"app.agents.refund_agent" = ["agent.json", "prompts/*.txt"]
